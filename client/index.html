<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0f19" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>AirBridge - Fast Cross-Device Sharing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css" />
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>

<body>
  <canvas id="bgParticles" class="bg-particles-canvas"></canvas>
    <div id="app">
    <!-- Minimal Header -->
    <header class="app-header">
            <div class="brand">
        <img src="./logo.jpg" alt="AirBridge Logo" class="brand-logo-img" />
        <span class="brand-name">AirBridge</span>
      </div>
      <div id="statusPill" class="status-pill waiting">
        <span class="dot"></span>
        <span id="statusText">Ready</span>
      </div>
    </header>

    <!-- Main Center Content -->
    <main class="main-content">
      <!-- SCREEN 1: MINIMAL PAIRING / QR CARD -->
      <div id="pairingSection" class="share-card">
        <div class="qr-container">
          <canvas id="qrCanvas"></canvas>
        </div>

        <div class="pin-block">
          <span class="pin-hint">Scan with camera or use PIN</span>
          <div class="pin-number" id="myPin">----</div>
          <button id="copyLinkBtn" class="btn-copy">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
            </svg>
            <span>Copy Link</span>
          </button>
        </div>

        <div class="manual-join">
          <form id="joinForm" class="join-row">
            <input type="text" id="joinInput" placeholder="Enter 4-digit PIN" maxlength="4" inputmode="numeric"
              pattern="[0-9]*" autocomplete="off" />
            <button type="submit" id="joinBtn" class="btn-join">Connect</button>
          </form>
        </div>

        <div id="connectionStatus" class="status-msg">
          Waiting for other device...
        </div>
      </div>

      <!-- SCREEN 2: CLEAN TRANSFER CARD (Shown when connected) -->
      <div id="transferSection" class="share-card hidden">
        <div class="device-connected-banner">
          <div class="connected-icon">📱</div>
          <div class="connected-text">
            <span class="connected-label">CONNECTED</span>
            <h3 id="peerDeviceName">Phone</h3>
          </div>
          <button id="disconnectBtn" class="btn-disc">Leave</button>
        </div>

        <!-- Clean Drop Area -->
        <div id="dropZone" class="upload-dropzone">
          <input type="file" id="fileInput" class="file-input" multiple />
          <div class="upload-center">
            <div class="upload-icon-box">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="17 8 12 3 7 8" />
                <line x1="12" y1="3" x2="12" y2="15" />
              </svg>
            </div>
            <h3>Tap to choose files</h3>
            <p>Photos, Videos, Audio, Documents</p>
          </div>
        </div>

        <!-- Transfer Progress Card -->
        <div id="transferProgressCard" class="progress-box hidden">
          <div class="progress-header">
            <span id="currentFileName" class="file-name">filename.jpg</span>
            <span id="transferPercentage" class="progress-percent">0%</span>
          </div>
          <div class="progress-bar-bg">
            <div id="progressBar" class="progress-bar-fill"></div>
          </div>
          <div class="progress-stats">
            <span id="transferBytes">0 MB / 0 MB</span>
            <span id="transferSpeed">0 MB/s</span>
          </div>

          <div id="transferDoneBox" class="done-box hidden">
            <span>Downloaded</span>
            <a id="downloadBtn" class="btn-save" download>Save File</a>
          </div>
        </div>

        <!-- Recent Transferred Files -->
        <div class="transfers-container">
          <h4>History</h4>
          <div id="fileList" class="file-list">
            <div class="empty-list">No files transferred yet</div>
          </div>
        </div>
      </div>
    </main>

    <footer class="app-footer">
      <span>AirBridge</span>
    </footer>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
